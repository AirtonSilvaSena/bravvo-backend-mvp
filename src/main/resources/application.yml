spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        show_sql: true
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

gmail:
  client-id: ${GMAIL_CLIENT_ID}
  client-secret: ${GMAIL_CLIENT_SECRET}
  refresh-token: ${GMAIL_REFRESH_TOKEN}
  from: ${GMAIL_FROM:bravvoapp@gmail.com}

server:
  port: ${PORT:8080}

app:
  storage:
    logos-dir: /app/storage/logos

  jwt:
    issuer: bravvo-api
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 7