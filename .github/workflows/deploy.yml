name: Build and Deploy (Enterprise)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/airtonsilvasena/bravvo-backend-mvp:latest

      # Debug simples sem tailscale (opcional)
      - name: Debug reachability
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Testing TCP 22 on $SSH_HOST..."
          nc -vz "$SSH_HOST" 22

      - name: Deploy via SSH (native)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /opt/bravvo/infra
            bash ./deploy-api.sh
            echo "---- last api logs ----"
            docker logs --tail 120 bravvo-api || true
          EOF
